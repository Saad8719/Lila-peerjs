.indicator-like { left: 20px; color: #22c55e; border-color: #22c55e; }
.indicator-nope { right: 20px; color: #ef4444; border-color: #ef4444; transform: rotate(15deg); }
.indicator-super { top: 100px; left: 50%; transform: translateX(-50%); color: #3b82f6; border-color: #3b82f6; }

.dot { animation: typing 0.9s infinite; }
@keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.spinner { border: 2px solid rgba(90, 44, 122, 0.3); border-left-color: #5A2C7A; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }

.logo-heart { color: #F1C40F; font-size: 24px; }

<script>
    // ==========================================

    const PEER_HOST = 'lila-peerjs.onrender.com';

    let db = null;
    try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.warn("Supabase error", e); }

    let currentUser = null;
    let currentUserProfile = null;
    let isDemo = false;
    let profiles = [];
    let currentIndex = 0;
    let myLocation = { lat: 48.8566, lon: 2.3522 };
    let userPoints = 50;
    let isPremium = false;
    let peer = null;
    let myPeerId = null;
    let activeChatUser = null;
    let localMessagesDB = JSON.parse(localStorage.getItem('lila_messages')) || {};

    const DEMO_PROFILES = [
        { id: 'demo1', nom: 'Yasmine', âge: 23, job: 'Médecine', lat: 48.8600, lon: 2.3400, verified: true, prompt: 'Le Japon', photos: ['https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600'] },
            { id: 'demo2', nom: 'Sarah', âge: 22, job: 'Designer', lat: 48.8500, lon: 2.3500, verified: true, prompt: 'La photo', photos: ['https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600'] }
            ];

            // ==========================================
            // INITIALISATION & AUTHENTIFICATION
            // ==========================================
            async function initApp() {
                if (!db) return enterDemoMode();
                    const { data: { session } } = await db.auth.getSession();
                        if (session) {
                                currentUser = session.user;
                                        await loadUserData();
                                                enterApp();
                                                    }
                                                    }

                                                    async function loadUserData() {
                                                        if (isDemo) return;
                                                            const { data: prof } = await db.from('profiles').select('*').eq('user_id', currentUser.id).single();
                                                                if (prof) currentUserProfile = prof;
                                                                    const { data: stats } = await db.from('user_stats').select('*').eq('user_id', currentUser.id).single();
                                                                        if (stats) {
                                                                                userPoints = stats.points;
                                                                                        isPremium = stats.is_premium;
                                                                                                updatePointsUI();
                                                                                                        updatePremiumUI();
                                                                                                            }
                                                                                                            }

                                                                                                            function setAuthMode(mode) {
                                                                                                                document.getElementById('signup-fields').classList.toggle('hidden', mode === 'login');
                                                                                                                    document.getElementById('tab-login').className = mode === 'login' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-[#5A2C7A] text-white" : "flex-1 py-2 text-xs font-bold text-gray-500";
                                                                                                                        document.getElementById('tab-signup').className = mode === 'signup' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-[#5A2C7A] text-white" : "flex-1 py-2 text-xs font-bold text-gray-500";
                                                                                                                            document.getElementById('auth-btn').innerText = mode === 'login' ? "Se connecter" : "S'inscrire";
                                                                                                                                document.getElementById('auth-form').dataset.mode = mode;
                                                                                                                                }

                                                                                                                                async function handleAuthSubmit(e) {
                                                                                                                                    e.preventDefault();
                                                                                                                                        const mode = e.target.dataset.mode || 'login';
                                                                                                                                            const email = document.getElementById('auth-email').value;
                                                                                                                                                const password = document.getElementById('auth-password').value;
                                                                                                                                                    const nom = document.getElementById('auth-name').value;
                                                                                                                                                        const btn = document.getElementById('auth-btn');
                                                                                                                                                            btn.innerHTML = '<div class="spinner"></div>';
                                                                                                                                                                try {
                                                                                                                                                                        if (mode === 'signup') {
                                                                                                                                                                                    const { data, error } = await db.auth.signUp({ email, password, options: { data: { nom } } });
                                                                                                                                                                                                if (error) throw error;
                                                                                                                                                                                                            if (data.user) showToast("Compte créé ! Connexion...", false);
                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                const { error } = await db.auth.signInWithPassword({ email, password });
                                                                                                                                                                                                                                            if (error) throw error;
                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                            const { data: { session } } = await db.auth.getSession();
                                                                                                                                                                                                                                                                    if (session) { currentUser = session.user; await loadUserData(); enterApp(); }
                                                                                                                                                                                                                                                                            else btn.innerText = "Vérifiez vos emails";
                                                                                                                                                                                                                                                                                } catch (err) {
                                                                                                                                                                                                                                                                                        showToast(err.message, true);
                                                                                                                                                                                                                                                                                                btn.innerText = mode === 'login' ? "Se connecter" : "S'inscrire";
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                    function enterDemoMode() {
                                                                                                                                                                                                                                                                                                        isDemo = true;
                                                                                                                                                                                                                                                                                                            currentUserProfile = { nom: "Saad", âge: 26, photo_url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" };
                                                                                                                                                                                                                                                                                                                enterApp();
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                function enterApp() {
                                                                                                                                                                                                                                                                                                                    document.getElementById('auth-screen').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                        document.getElementById('app-screen').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                            updateProfileUI();
                                                                                                                                                                                                                                                                                                                                profiles = [...DEMO_PROFILES];
                                                                                                                                                                                                                                                                                                                                    renderCard();
                                                                                                                                                                                                                                                                                                                                        initPeerJS();
                                                                                                                                                                                                                                                                                                                                            if (!isDemo) loadCloudMatches();
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                            async function handleLogout() {
                                                                                                                                                                                                                                                                                                                                                if (db && !isDemo) await db.auth.signOut();
                                                                                                                                                                                                                                                                                                                                                    location.reload();
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                    // ==========================================
                                                                                                                                                                                                                                                                                                                                                    // SUPABASE INTEGRATION (Points, Storage)
                                                                                                                                                                                                                                                                                                                                                    // ==========================================
                                                                                                                                                                                                                                                                                                                                                    async function claimAdReward() {
                                                                                                                                                                                                                                                                                                                                                        if (isDemo) {
                                                                                                                                                                                                                                                                                                                                                                userPoints += 50; updatePointsUI(); showToast("+50 points (Démo)", false); return;
                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                        const { data, error } = await db.rpc('claim_ad_reward');
                                                                                                                                                                                                                                                                                                                                                                            if (error) return showToast(error.message, true);
                                                                                                                                                                                                                                                                                                                                                                                userPoints = data; updatePointsUI(); showToast("+50 points !", false);
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                // RENDU CARTE & SWIPE
                                                                                                                                                                                                                                                                                                                                                                                // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                function renderCard() {
                                                                                                                                                                                                                                                                                                                                                                                    const card = document.getElementById('card-container');
                                                                                                                                                                                                                                                                                                                                                                                        card.style.transform = 'translate(0,0) rotate(0)'; card.style.opacity = '1';
                                                                                                                                                                                                                                                                                                                                                                                            if (currentIndex >= profiles.length) {
                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('card-name').innerText = "Fin des profils";
                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('card-img').src = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600";
                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                            const p = profiles[currentIndex];
                                                                                                                                                                                                                                                                                                                                                                                                                                const dist = calculateDistance(myLocation.lat, myLocation.lon, p.lat || 48.85, p.lon || 2.35);
                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('card-name').innerText = p.nom;
                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('card-age').innerText = p.âge + " ans";
                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('card-job').innerText = p.job || "Célibataire";
                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('card-prompt').innerText = p.prompt || "...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('card-distance').innerText = `À ${dist} km`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('card-img').src = p.photo_url || (p.photos ? p.photos[0] : '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('card-verified').classList.toggle('hidden', !p.verified);
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            function swipeAction(dir) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                const card = document.getElementById('card-container');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (dir === 'like' || dir === 'superlike') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.style.transform = 'translateX(120%) rotate(20deg)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    setTimeout(() => { closeModal('match-modal'); currentIndex++; renderCard(); }, 300);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            openModal('match-modal');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        card.style.transform = 'translateX(-120%) rotate(-20deg)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setTimeout(() => { currentIndex++; renderCard(); }, 300);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        card.style.opacity = '0';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let startX = 0, dx = 0, dragging = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const cardEl = document.getElementById('card-container');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(cardEl) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cardEl.addEventListener('pointerdown', e => { dragging = true; startX = e.clientX; cardEl.style.transition = 'none'; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.addEventListener('pointermove', e => { if(!dragging) return; dx = e.clientX - startX; cardEl.style.transform = `translate(${dx}px, 0) rotate(${dx*0.1}deg)`; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.addEventListener('pointerup', () => { if(!dragging) return; dragging = false; if(dx>100) swipeAction('like'); else if(dx<-100) swipeAction('dislike'); else cardEl.style.transform='translate(0,0)'; dx=0; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function handleSwipe(dir) { swipeAction(dir); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // CHAT & WEBRTC
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function initPeerJS() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                peer = new Peer('lila-' + Math.floor(Math.random()*90000+10000), {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            host: PEER_HOST, port: PEER_PORT, path: PEER_PATH, secure: true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            peer.on('open', id => { myPeerId = id; const el = document.getElementById('my-peer-id'); if(el) el.innerText = id; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    peer.on('connection', conn => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                conn.on('data', data => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(data.type === 'chat') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(!localMessagesDB[data.senderId]) localMessagesDB[data.senderId] = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        localMessagesDB[data.senderId].push({sender:'them', text:data.text, time:getCurrentTime()});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem('lila_messages', JSON.stringify(localMessagesDB));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(activeChatUser && activeChatUser.id === data.senderId) appendMessageToDOM(data.text, false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch(e) { console.warn(e); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function openChat(user) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            activeChatUser = user;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('chat-name').innerText = user.nom || user.name;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('chat-avatar').src = user.photo_url || user.avatar || '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showView('chat');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('chat-messages').innerHTML = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const msgs = localMessagesDB[user.id] || [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    msgs.forEach(m => appendMessageToDOM(m.text, m.sender === 'me'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function sendMessage() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const input = document.getElementById('chat-input');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(!input.value.trim() || !activeChatUser) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const text = input.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    appendMessageToDOM(text, true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        input.value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(!localMessagesDB[activeChatUser.id]) localMessagesDB[activeChatUser.id] = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                localMessagesDB[activeChatUser.id].push({sender:'me', text, time:getCurrentTime()});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    localStorage.setItem('lila_messages', JSON.stringify(localMessagesDB));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(activeChatUser) appendMessageToDOM("Super ! 😊", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }, 1500);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function appendMessageToDOM(text, isMe) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const div = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                div.className = isMe ? "flex justify-end" : "flex justify-start";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.innerHTML = `<div class="${isMe ? 'bg-[#5A2C7A] text-white' : 'bg-gray-200 text-gray-800'} px-4 py-2 rounded-2xl max-w-[80%] text-sm">${text}</div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('chat-messages').appendChild(div);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
